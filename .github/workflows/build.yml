name: Build Minecraft Mod

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Unzip source if zip exists
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            unzip -q *.zip
            cd NightmareSwarm-Forge-1.20.1* || true
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build with Gradle
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew build
          elif [ -f "NightmareSwarm-Forge-1.20.1/gradlew" ]; then
            cd NightmareSwarm-Forge-1.20.1
            chmod +x gradlew
            ./gradlew build
          else
            gradle build
          fi

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightmareswarm-jar
          path: "**/build/libs/*.jar"
