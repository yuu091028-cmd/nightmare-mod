name: Build Minecraft Mod

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Unzip source
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            unzip -q *.zip
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build with Gradle
        run: |
          # gradlewがある場所を自動で探してビルドを実行する
          GRADLEW_PATH=$(find . -name "gradlew" -type f -print -quit)
          if [ -n "$GRADLEW_PATH" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW_PATH")
            echo "Found gradlew at: $PROJECT_DIR"
            cd "$PROJECT_DIR"
            chmod +x gradlew
            ./gradlew build --no-daemon
          else
            echo "gradlew not found, trying default gradle"
            gradle build
          fi

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightmareswarm-jar
          path: "**/build/libs/*.jar"
